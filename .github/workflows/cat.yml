name: Generate Cat

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Walk duration in seconds"
        required: false
        default: "25"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the contribution cat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/gen_cat_graph.py \
            --user MadB0i \
            --out dist \
            --duration "${{ github.event.inputs.duration || '25' }}"

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
