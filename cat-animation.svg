<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <filter id="pGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#A78BFA" opacity="0.5"/>
    </pattern>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.7" fill="#A78BFA" opacity="0.16"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="900" height="260" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="260" fill="#05060A"/>
    <rect width="900" height="260" fill="url(#dots)"/>

    <!-- perspective floor grid -->
    <g stroke="#22D3EE" stroke-width="0.6" opacity="0.22">
      <line x1="0" y1="196" x2="900" y2="196"/>
      <line x1="0" y1="206" x2="900" y2="206"/>
      <line x1="0" y1="219" x2="900" y2="219"/>
      <line x1="0" y1="236" x2="900" y2="236"/>
      <line x1="450" y1="186" x2="450" y2="260"/>
      <line x1="330" y1="186" x2="240" y2="260"/>
      <line x1="570" y1="186" x2="660" y2="260"/>
      <line x1="390" y1="186" x2="350" y2="260"/>
      <line x1="510" y1="186" x2="550" y2="260"/>
    </g>

    <!-- horizon glow -->
    <rect x="0" y="193" width="900" height="3" fill="#22D3EE" opacity="0.5" filter="url(#cGlow)">
      <animate attributeName="opacity" values="0.25;0.7;0.25" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- ================= HUD CHROME ================= -->
    <g stroke="#A78BFA" stroke-width="1.4" fill="none" opacity="0.85">
      <path d="M16 34 L16 16 L40 16"/>
      <path d="M884 34 L884 16 L860 16"/>
      <path d="M16 226 L16 244 L40 244"/>
      <path d="M884 226 L884 244 L860 244"/>
    </g>

    <g font-family="Fira Code, ui-monospace, monospace" font-size="10" letter-spacing="1.6" fill="#A78BFA" opacity="0.9">
      <text x="60" y="30">MASCOT.EXE</text>
      <text x="848" y="30" fill="#22D3EE" text-anchor="end">ON_DUTY</text>
      <text x="52" y="240" fill="#5B6478">// supervising every commit</text>
      <text x="848" y="240" fill="#5B6478" text-anchor="end">v2.0</text>
    </g>

    <circle cx="48" cy="26" r="3.2" fill="#22D3EE" filter="url(#cGlow)">
      <animate attributeName="opacity" values="1;0.15;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- ================= FLOATING GLYPHS ================= -->
    <g font-family="Fira Code, ui-monospace, monospace" font-size="13" fill="#A78BFA" filter="url(#pGlow)">
      <text x="150" y="120" opacity="0.75">&lt;/&gt;</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14" dur="3s" repeatCount="indefinite"/>
      <text x="700" y="132" opacity="0.6" fill="#22D3EE">&#123;&#125;</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
      <text x="215" y="168" opacity="0.5" font-size="11">fn</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10" dur="4.2s" begin="1.2s" repeatCount="indefinite"/>
      <text x="655" y="176" opacity="0.5" font-size="11" fill="#22D3EE">$</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -11" dur="3.9s" begin="0.3s" repeatCount="indefinite"/>
    </g>

    <!-- ================= NEON CAT ================= -->
    <g filter="url(#pGlow)" fill="none" stroke="#A78BFA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

      <!-- tail -->
      <g>
        <path d="M492 158 Q 540 168 556 140 Q 566 122 548 116"/>
        <animateTransform attributeName="transform" type="rotate"
                          values="-7 492 158; 9 492 158; -7 492 158"
                          dur="3.4s" repeatCount="indefinite"/>
      </g>

      <!-- body -->
      <path d="M418 158 Q 414 190 450 192 Q 486 190 482 158"/>

      <!-- head -->
      <ellipse cx="450" cy="128" rx="30" ry="27"/>

      <!-- ears -->
      <path d="M425 108 L429 88 L444 104"/>
      <path d="M475 108 L471 88 L456 104"/>

      <!-- inner ears -->
      <path d="M430 106 L432 95 L440 105" stroke="#22D3EE" stroke-width="1.3" opacity="0.8"/>
      <path d="M470 106 L468 95 L460 105" stroke="#22D3EE" stroke-width="1.3" opacity="0.8"/>

      <!-- eyes -->
      <ellipse cx="439" cy="127" rx="5" ry="6" fill="#22D3EE" stroke="none">
        <animate attributeName="ry" values="6;6;0.4;6;6" keyTimes="0;0.86;0.9;0.94;1" dur="4.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="462" cy="127" rx="5" ry="6" fill="#22D3EE" stroke="none">
        <animate attributeName="ry" values="6;6;0.4;6;6" keyTimes="0;0.86;0.9;0.94;1" dur="4.4s" begin="0.12s" repeatCount="indefinite"/>
      </ellipse>

      <!-- nose + mouth -->
      <path d="M446 138 L454 138 L450 143 Z" fill="#22D3EE" stroke="none" filter="url(#cGlow)"/>
      <path d="M450 143 L450 147" stroke-width="1.6"/>
      <path d="M443 149 Q 450 154 457 149" stroke-width="1.6"/>

      <!-- whiskers -->
      <g stroke-width="1.1" opacity="0.75">
        <line x1="424" y1="136" x2="406" y2="132"/>
        <line x1="424" y1="142" x2="406" y2="144"/>
        <line x1="476" y1="136" x2="494" y2="132"/>
        <line x1="476" y1="142" x2="494" y2="144"/>
      </g>
    </g>

    <!-- ================= NEON LAPTOP ================= -->
    <g filter="url(#cGlow)" stroke="#22D3EE" stroke-width="2" fill="none" stroke-linejoin="round">
      <rect x="404" y="196" width="92" height="40" rx="4" fill="#05060A"/>
      <g stroke-width="1.2" opacity="0.85">
        <line x1="414" y1="208" x2="452" y2="208"/>
        <line x1="414" y1="216" x2="472" y2="216"/>
        <line x1="414" y1="224" x2="440" y2="224"/>
      </g>
      <path d="M396 236 L504 236"/>
      <circle cx="490" cy="207" r="2.4" fill="#22D3EE" stroke="none">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- paws on keyboard -->
    <g fill="#A78BFA" filter="url(#pGlow)">
      <ellipse cx="404" cy="238" rx="12" ry="5">
        <animate attributeName="cy" values="238;234;238" dur="0.7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="496" cy="238" rx="12" ry="5">
        <animate attributeName="cy" values="234;238;234" dur="0.7s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- ================= SCANLINES ================= -->
    <g opacity="0.16">
      <rect x="0" y="0" width="900" height="260" fill="url(#scan)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 4" dur="0.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- vignette sweep -->
    <rect x="0" y="0" width="900" height="130" fill="#A78BFA" opacity="0.05">
      <animate attributeName="y" values="-130;260" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.7" y="0.7" width="898.6" height="258.6" rx="14" fill="none" stroke="#A78BFA" stroke-width="1.2" opacity="0.4"/>
</svg>
