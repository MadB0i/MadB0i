<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="42%"  stop-color="#A78BFA" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#C4B5FD" stop-opacity="1"/>
      <stop offset="58%"  stop-color="#A78BFA" stop-opacity="1"/>
      <stop offset="78%"  stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- soft halo -->
  <rect x="0" y="10.6" width="900" height="2.8" rx="1.4" fill="url(#lineGrad)" opacity="0.22"/>
  <!-- core line -->
  <rect x="0" y="11.3" width="900" height="1.4" rx="0.7" fill="url(#lineGrad)"/>

  <!-- center diamond -->
  <g filter="url(#glow)">
    <polygon points="450,4.5 457.5,12 450,19.5 442.5,12" fill="#A78BFA">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3.6s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- symmetric flanking ticks -->
  <rect x="424" y="11.1" width="9" height="1.8" rx="0.9" fill="#A78BFA" opacity="0.7"/>
  <rect x="467" y="11.1" width="9" height="1.8" rx="0.9" fill="#A78BFA" opacity="0.7"/>
</svg>
